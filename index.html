<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>誕生日 性格診断</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .card-appear { animation: fadeIn 0.4s ease; }
  .card-bg { background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95); }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4">
<div class="max-w-xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-1 text-indigo-400">✨ 誕生日 性格診断</h1>
  <p class="text-center text-gray-400 text-sm mb-6">星座・干支・血液型の組み合わせであなたの性格を診断</p>

  <!-- Input -->
  <div class="bg-gray-800 rounded-lg p-5 mb-6">
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label for="birthMonth" class="block text-sm text-gray-400 mb-1">生まれ月</label>
        <select id="birthMonth" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white">
          <option value="">月を選択</option>
          <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
          <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
          <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
          <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
        </select>
      </div>
      <div>
        <label for="birthDay" class="block text-sm text-gray-400 mb-1">生まれ日</label>
        <select id="birthDay" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white">
          <option value="">日を選択</option>
        </select>
      </div>
      <div>
        <label for="birthYear" class="block text-sm text-gray-400 mb-1">生まれ年</label>
        <select id="birthYear" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white">
          <option value="">年を選択（干支用）</option>
        </select>
      </div>
      <div>
        <label for="bloodType" class="block text-sm text-gray-400 mb-1">血液型</label>
        <select id="bloodType" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white">
          <option value="">血液型を選択</option>
          <option value="A">A型</option><option value="B">B型</option>
          <option value="O">O型</option><option value="AB">AB型</option>
        </select>
      </div>
    </div>
    <button id="diagnoseBtn"
      class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-bold transition-all"
      aria-label="性格を診断する">
      🔮 診断する
    </button>
  </div>

  <!-- Result Card -->
  <div id="resultCard" class="hidden card-appear">
    <div class="card-bg rounded-2xl p-6 shadow-2xl border border-indigo-700 mb-4">
      <div class="flex items-start justify-between mb-4">
        <div>
          <div id="cardTitle" class="text-2xl font-bold text-yellow-300 mb-1"></div>
          <div id="cardSub" class="text-gray-300 text-sm"></div>
        </div>
        <div id="cardSymbol" class="text-5xl"></div>
      </div>
      <div id="cardDesc" class="text-gray-100 text-sm leading-relaxed mb-4"></div>
      <div class="grid grid-cols-3 gap-2 text-center text-xs">
        <div class="bg-black bg-opacity-30 rounded p-2">
          <div class="text-gray-400">星座</div>
          <div id="cardZodiac" class="text-yellow-300 font-bold"></div>
        </div>
        <div class="bg-black bg-opacity-30 rounded p-2">
          <div class="text-gray-400">干支</div>
          <div id="cardEto" class="text-green-300 font-bold"></div>
        </div>
        <div class="bg-black bg-opacity-30 rounded p-2">
          <div class="text-gray-400">血液型</div>
          <div id="cardBlood" class="text-red-300 font-bold"></div>
        </div>
      </div>
    </div>
    <div class="flex gap-3">
      <button id="rerollBtn"
        class="flex-1 py-2 bg-purple-700 hover:bg-purple-600 rounded-lg text-sm font-bold"
        aria-label="別パターンで診断">🎲 別パターン</button>
      <button id="shareBtn"
        class="flex-1 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-bold"
        aria-label="カード画像を生成">📷 画像生成</button>
    </div>
    <canvas id="shareCanvas" class="hidden mt-4 rounded-lg max-w-full"></canvas>
  </div>
</div>

<script>
const ZODIAC = [
  {name:'山羊座',symbol:'♑',from:[12,22],to:[1,19]},
  {name:'水瓶座',symbol:'♒',from:[1,20],to:[2,18]},
  {name:'魚座',symbol:'♓',from:[2,19],to:[3,20]},
  {name:'牡羊座',symbol:'♈',from:[3,21],to:[4,19]},
  {name:'牡牛座',symbol:'♉',from:[4,20],to:[5,20]},
  {name:'双子座',symbol:'♊',from:[5,21],to:[6,20]},
  {name:'蟹座',symbol:'♋',from:[6,21],to:[7,22]},
  {name:'獅子座',symbol:'♌',from:[7,23],to:[8,22]},
  {name:'乙女座',symbol:'♍',from:[8,23],to:[9,22]},
  {name:'天秤座',symbol:'♎',from:[9,23],to:[10,22]},
  {name:'蠍座',symbol:'♏',from:[10,23],to:[11,21]},
  {name:'射手座',symbol:'♐',from:[11,22],to:[12,21]},
];

const ETO = ['子（ねずみ）','丑（うし）','寅（とら）','卯（うさぎ）','辰（たつ）','巳（へび）',
             '午（うま）','未（ひつじ）','申（さる）','酉（とり）','戌（いぬ）','亥（いのしし）'];

function getZodiac(month, day) {
  for (const z of ZODIAC) {
    const [fm, fd] = z.from; const [tm, td] = z.to;
    if ((month === fm && day >= fd) || (month === tm && day <= td)) return z;
  }
  return ZODIAC[0];
}

function getEto(year) {
  return ETO[((year - 4) % 12 + 12) % 12];
}

// Personality patterns: [title, desc] keyed by zodiac-index(0-11) + blood
const PERSONALITY_POOL = [
  // 人生哲学系
  ['カオスの天才','計画通りに進んだことが一度もないが、なぜかいつも奇跡的にうまくいく人。「失敗」という概念が辞書に載っていない。'],
  ['完璧主義者のズボラ','細部にこだわりすぎて始められず、締め切り前日に全力疾走する伝説の存在。'],
  ['空気読みすぎマスター','周囲の感情を先読みしすぎて疲弊する。他人の悩みを自分のことのように抱え込む敏感な賢者。'],
  ['天然ボケの天才','言った後に気づく。やってから考える。でも結果はなぜかいつも正解。'],
  ['謙虚な野心家','表向きはおとなしいが内心では宇宙征服を本気で考えている。'],
  ['話が長い哲学者','「要するに」と言ってから3分話す。でも内容は本当に深い。'],
  ['世話焼き中毒','放っておけない体質。頼まれてないのに全部やる。感謝されると涙が出る。'],
  ['独立独歩の変わり者','群れるのが苦手。ひとりで何でもできるが、実は寂しがり屋。'],
  ['スロースターターの覇者','最初は動じないが、一度エンジンがかかると誰も止められない。'],
  ['感情豊かすぎる審美家','映画で泣く→広告で泣く→おいしいご飯で泣く→幸せすぎて泣く。'],
  ['現実主義ドリーマー','「夢は叶う」と信じつつ、念のため3つのバックアッププランを用意している。'],
  ['ツッコミ体質','正しい情報を見ると黙っていられない。正義感が強すぎて損をすることも。'],
  ['マイペース伝道師','周囲がどんなにあわてても自分の速度は変わらない。それが逆に周りを落ち着かせる。'],
  ['直感の魔女/魔法使い','理屈より感覚。なんとなくで動いてほぼ正解。根拠を聞かれると困る。'],
  ['情報収集オタク','調べ物が好きすぎて、本来の目的を忘れて深みにはまる。でもその知識が意外な場面で活きる。'],
  ['笑顔の交渉人','誰とでも仲良くなれるが、それが逆に誰とでも戦える能力にもなっている。'],
  ['過去の栄光コレクター','あの頃は良かったと言いながら、実は今も成長し続けている。'],
  ['未来予測士','「そうなると思ってた」と言いがち。でも予測の精度は本当に高い。'],
  ['平和の番人','争いが嫌い。でも正義のためなら最初に立ち上がる矛盾した勇者。'],
  ['収集癖の芸術家','捨てられない。でも「いつか使う」はたいてい本当にいつか使う。'],
  ['論理と感情の二重人格','頭では理解しているが心が拒否する。いつも自分の中で会議が開かれている。'],
  ['リスク0主義','万全の準備なしには動けない。でも準備している間に状況が変わる永遠のジレンマ。'],
  ['ランダム型天才','脈絡のない発想が突然正解になる。天才か？ただのラッキーか？本人にもわからない。'],
  ['超絶気遣いガバガバ当人','他人への配慮は完璧なのに、自分の体調管理がゼロ。'],
  ['哲学的な行動派','考えながら走る。走りながら考える。立ち止まったことがない。'],
  ['優しい毒舌家','褒めているのか嫌みなのかわからない。でも根は誰より温かい。'],
  ['朝が弱いリーダー','夜に最高の決断をし、朝にそれを実行する意志の人。起床時だけ別人。'],
  ['ルール創造者','既存のルールに納得できず自分でルールを作る。組織に入ると大変なことになる。'],
  ['感謝を忘れない職人','結果より過程を大切にする。仕事へのこだわりが時々迷惑になることも。'],
  ['天才的な先延ばし師','締め切り3時間前が最も生産性が高い。それを自覚しつつ直せない。'],
  ['秘密主義の共感者','自分のことは話さないが、他人の相談には全力で乗る。',''],
  ['運命を信じる現実主義','偶然なんてないと言いながら、星座も占いも全部チェックする。'],
  ['多才すぎる中途半端','何でもできるが何かに特化できない。でも組み合わせると無敵になる。'],
  ['静かな革命家','目立たないが、気づいたら周囲の価値観を変えていた人物。'],
  ['笑いの求道者','笑えない状況で笑いを見つける。空気を読まない勇気の持ち主。'],
];

let currentPatternIdx = 0;
let lastZodiac = null, lastEto = null, lastBlood = null, lastTitle = null, lastDesc = null;

function getPatternIdx(zodiacIdx, etoIdx, bloodType, reroll) {
  const keys = {'A':0,'B':1,'O':2,'AB':3};
  const bNum = keys[bloodType] || 0;
  const base = (zodiacIdx * 7 + etoIdx * 3 + bNum * 5) % PERSONALITY_POOL.length;
  if (reroll) {
    currentPatternIdx = (currentPatternIdx + 1) % PERSONALITY_POOL.length;
    return (base + currentPatternIdx) % PERSONALITY_POOL.length;
  }
  currentPatternIdx = 0;
  return base;
}

// Init year select
const yearSel = document.getElementById('birthYear');
const curYear = new Date().getFullYear();
for (let y = curYear; y >= curYear - 100; y--) {
  const opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y + '年';
  yearSel.appendChild(opt);
}

// Init day select based on month
document.getElementById('birthMonth').addEventListener('change', function() {
  const m = parseInt(this.value);
  const daySel = document.getElementById('birthDay');
  daySel.innerHTML = '<option value="">日を選択</option>';
  if (!m) return;
  const days = [0,31,29,31,30,31,30,31,31,30,31,30,31];
  for (let d = 1; d <= days[m]; d++) {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d + '日';
    daySel.appendChild(opt);
  }
});

function runDiagnosis(reroll) {
  const month = parseInt(document.getElementById('birthMonth').value);
  const day = parseInt(document.getElementById('birthDay').value);
  const year = parseInt(document.getElementById('birthYear').value);
  const blood = document.getElementById('bloodType').value;
  if (!month || !day || !year || !blood) {
    alert('全項目を入力してください');
    return;
  }
  const zodiac = getZodiac(month, day);
  const eto = getEto(year);
  const zodiacIdx = ZODIAC.indexOf(zodiac);
  const etoIdx = ETO.indexOf(eto);

  const pidx = getPatternIdx(zodiacIdx, etoIdx, blood, reroll);
  const pattern = PERSONALITY_POOL[pidx];

  lastZodiac = zodiac; lastEto = eto; lastBlood = blood;
  lastTitle = pattern[0]; lastDesc = pattern[1];

  document.getElementById('cardTitle').textContent = pattern[0];
  document.getElementById('cardSub').textContent = `${zodiac.name} × ${eto.split('（')[0]} × ${blood}型`;
  document.getElementById('cardSymbol').textContent = zodiac.symbol;
  document.getElementById('cardDesc').textContent = pattern[1];
  document.getElementById('cardZodiac').textContent = zodiac.name + ' ' + zodiac.symbol;
  document.getElementById('cardEto').textContent = eto;
  document.getElementById('cardBlood').textContent = blood + '型';

  const card = document.getElementById('resultCard');
  card.classList.remove('hidden');
  card.classList.remove('card-appear');
  void card.offsetWidth;
  card.classList.add('card-appear');
}

document.getElementById('diagnoseBtn').addEventListener('click', () => runDiagnosis(false));
document.getElementById('rerollBtn').addEventListener('click', () => runDiagnosis(true));

document.getElementById('shareBtn').addEventListener('click', () => {
  if (!lastZodiac) return;
  const canvas = document.getElementById('shareCanvas');
  canvas.width = 500; canvas.height = 280;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,500,280);
  grad.addColorStop(0,'#1e1b4b'); grad.addColorStop(0.5,'#312e81'); grad.addColorStop(1,'#4c1d95');
  ctx.fillStyle = grad; ctx.fillRect(0,0,500,280);
  ctx.fillStyle = '#a5b4fc'; ctx.font = 'bold 14px sans-serif';
  ctx.fillText('✨ 誕生日性格診断', 20, 35);
  ctx.fillStyle = '#fde68a'; ctx.font = 'bold 26px sans-serif';
  ctx.fillText(lastTitle, 20, 75);
  ctx.fillStyle = '#e2e8f0'; ctx.font = '14px sans-serif';
  ctx.fillText(`${lastZodiac.name} × ${lastEto.split('（')[0]} × ${lastBlood}型`, 20, 105);
  // wrap desc
  ctx.fillStyle = '#cbd5e1'; ctx.font = '12px sans-serif';
  const words = lastDesc.split('');
  let line = ''; let y = 135;
  for (const w of words) {
    if (ctx.measureText(line + w).width > 460) { ctx.fillText(line, 20, y); line = w; y += 20; }
    else line += w;
  }
  if (line) ctx.fillText(line, 20, y);
  ctx.fillStyle = '#a78bfa'; ctx.font = '80px sans-serif';
  ctx.fillText(lastZodiac.symbol, 420, 90);
  canvas.classList.remove('hidden');
});
</script>
</body>
</html>
